# f-droid build recipe.
# goes in fdroiddata as metadata/<applicationId>.yml - rename this file once
# the final applicationId is decided. replace every FILL_ME first.

Categories:
  - Internet
  - Security
License: GPL-3.0-or-later
AuthorName: FILL_ME
SourceCode: FILL_ME
IssueTracker: FILL_ME

RepoType: git
Repo: FILL_ME

Builds:
  - versionName: 0.1.0-alpha
    versionCode: 1
    commit: FILL_ME            # a tag, not a branch
    subdir: mobile

    # go, pinned to the version the shipped binary was built with.
    # sha256: curl -sL https://go.dev/dl/go1.23.4.linux-amd64.tar.gz.sha256
    sudo:
      - curl -sLo /tmp/go.tgz https://go.dev/dl/go1.23.4.linux-amd64.tar.gz
      - echo "FILL_ME_GO_SHA256  /tmp/go.tgz" | sha256sum -c -
      - tar -C /usr/local -xzf /tmp/go.tgz
      - rm -f /tmp/go.tgz

    # exact flutter sdk. if 3.41.7 is missing from the srclib it needs a
    # small pr to fdroiddata srclibs/flutter.yml first.
    srclibs:
      - flutter@3.41.7

    # the engine builds from source; no prebuilt .so is committed.
    prebuild:
      - pushd ../engine
      - PATH=/usr/local/go/bin:$PATH ANDROID_NDK_HOME=$$NDK$$ ./build.sh
      - popd

    build:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --offline
      - $$flutter$$/bin/flutter build apk --release --target-platform android-arm64

    output: build/app/outputs/flutter-apk/app-release.apk
    ndk: 28.2.13676358

# cert sha-256 of the release keystore, lowercase, no colons.
# apksigner verify --print-certs app-release.apk
AllowedAPKSigningKeys: FILL_ME_CERT_SHA256

AutoUpdateMode: None
UpdateCheckMode: Tags
CurrentVersion: 0.1.0-alpha
CurrentVersionCode: 1
