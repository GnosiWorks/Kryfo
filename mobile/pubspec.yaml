name: kryfo
description: "Kryfo: private messages over Tor. No phone number."
publish_to: 'none'

# name+code. split apks get code*10 plus 1, 2 or 3 by abi (build.gradle.kts)
version: 0.6.1+30

environment:
  sdk: ^3.11.5
  flutter: 3.41.7

dependencies:
  flutter:
    sdk: flutter
  # the app's words, from lib/l10n. part of the flutter sdk, not pub.dev.
  flutter_localizations:
    sdk: flutter

  sqflite_sqlcipher: ^3.4.0
  qr_flutter: ^4.1.0
  ffi: ^2.2.0
  flutter_local_notifications: ^22.3.1
  file_picker: ^13.1.0
  path_provider: ^2.1.5
  path: ^1.9.1
  record: ^6.2.0
  record_platform_interface: ^1.6.0
  just_audio: ^0.10.5
  image_picker: ^1.2.1
  # its photo picker switch, set for a mixed gallery pick only
  image_picker_android: ^0.8.13+17
  image_picker_platform_interface: ^2.11.1
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.2
  permission_handler: ^12.0.1
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.1.1
  app_links: ^7.0.0
  crypto: ^3.0.7
  # mit, pure dart: a computer draws pictures again with it (desk_draw.dart)
  image: ^4.10.1
  ed25519_edwards: ^0.3.1
  local_auth: ^3.0.1
  share_plus: ^13.3.0
  flutter_zxing:
    path: third_party/flutter_zxing
  camera:
    path: third_party/camera/camera
  # files dropped on a chat on a computer: desktop_drop 0.8.4, pinned and cut
  # to linux and windows (see its pubspec)
  desktop_drop:
    path: third_party/desktop_drop
  # the database on linux and windows: sqlcipher shipped with the app, loaded
  # over ffi. sqlite3 stays on 2.x, which has no build hook to fetch or
  # compile a sqlite of its own
  sqflite_common_ffi: 2.3.7+1
  sqlite3: ^2.9.4
  # the plugins' desktop sides, replaced or set up in lib/desktop
  camera_platform_interface:
    path: third_party/camera/camera_platform_interface
  sqflite_common: 2.5.8
  connectivity_plus_platform_interface: ^2.1.0
  file_selector_linux: ^0.9.4+1
  file_selector_platform_interface: ^2.7.0
  flutter_local_notifications_linux: ^8.0.1
  flutter_local_notifications_platform_interface: ^12.2.0
  flutter_secure_storage_platform_interface: ^2.1.1
  just_audio_platform_interface: ^4.6.0
  path_provider_linux: ^2.2.2
  path_provider_platform_interface: ^2.1.3
  shared_preferences_linux: ^2.4.1
  shared_preferences_platform_interface: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # the file picker's android side, driven over its channel in tests
  android_file_picker: ^2.0.0
  # reads the notes export's zip back in its tests
  archive: ^4.3.0

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  # a build that names no flavor is the foss one, what f-droid and github ship
  default-flavor: foss

  # lib/l10n/*.arb -> lib/l10n/app_localizations*.dart (see l10n.yaml)
  generate: true

  uses-material-design: true

  assets:
    - assets/geo/world.bin
    - assets/geo/places.bin.gz
    - assets/stickers/fokia.kst
    - assets/stickers/fokiaremix.kst
    - assets/opencc/STCharacters.txt.gz
    - assets/opencc/STPhrases.txt.gz
    - assets/opencc/TWVariants.txt.gz
    - assets/opencc/HKVariants.txt.gz
    # written by native/kryfo_signal/acknowledgments.sh
    - assets/licences/rust.json
    # written by engine/acknowledgments.sh
    - assets/licences/engine.json
    # written by engine/native-acknowledgments.sh
    - assets/licences/native.json
    # the repository's LICENSE
    - assets/licences/gpl-3.0.txt

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
        - asset: assets/fonts/Fraunces-Italic.ttf
          style: italic
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/InstrumentSans.ttf
        - asset: assets/fonts/InstrumentSans-Italic.ttf
          style: italic
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
        - asset: assets/fonts/JetBrainsMono-Italic.ttf
          style: italic
    # fallbacks, cut down by assets/fonts/noto-subset.sh to the scripts our
    # three fonts lack: cyrillic behind fraunces and instrument sans, arabic,
    # persian and hindi's devanagari behind all three. chinese is left to the
    # phone's font.
    - family: Noto Serif Cyrillic
      fonts:
        - asset: assets/fonts/NotoSerif-Cyrillic.ttf
        - asset: assets/fonts/NotoSerif-Cyrillic-Italic.ttf
          style: italic
    - family: Noto Sans Cyrillic
      fonts:
        - asset: assets/fonts/NotoSans-Cyrillic.ttf
    # instrument sans in vietnamese: it lacks the stacked accents
    - family: Noto Sans Vietnamese
      fonts:
        - asset: assets/fonts/NotoSans-Vietnamese.ttf
    - family: Noto Naskh Arabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Kryfo.ttf
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Kryfo.ttf
    - family: Noto Sans Devanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Kryfo.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/halo_icon.png"
  adaptive_icon_background: "#0D0B09"
  adaptive_icon_foreground: "assets/icon/halo_icon_fg.png"
  min_sdk_android: 23
  remove_alpha_ios: true

# android draws no splash picture of kryfo's: on 12 and later the icon the
# app was opened from (a plain icon keeps its face), on 11 and below plain
# ink (res/drawable/launch_background.xml). tool/ring_splash.py draws
# assets/icon/kryfo_ring.svg to pngs where a ring splash is wanted:
#
#   python3 tool/ring_splash.py <path> <size> full   ring across the canvas
#   python3 tool/ring_splash.py <path> <size> safe   inside the middle two
#                                                    thirds android 12+ masks to
#
# this block is kept so the config matches what is on screen if anyone ever
# does run the package.
flutter_native_splash:
  color: "#0D0B09"
  image: "assets/icon/kryfo_ring.png"
  android: false
  ios: true

# the camera plugin's platform packages, vendored so the scanner builds offline
dependency_overrides:
  camera:
    path: third_party/camera/camera
  camera_android_camerax:
    path: third_party/camera/camera_android_camerax
  camera_avfoundation:
    path: third_party/camera/camera_avfoundation
  camera_platform_interface:
    path: third_party/camera/camera_platform_interface
  camera_web:
    path: third_party/camera/camera_web
