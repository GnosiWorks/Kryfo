# the app's words live in lib/l10n/app_<locale>.arb. app_en.arb is the
# template: every key starts there. `flutter gen-l10n` (and every build)
# writes lib/l10n/app_localizations*.dart from them.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
untranslated-messages-file: build/l10n_untranslated.json
