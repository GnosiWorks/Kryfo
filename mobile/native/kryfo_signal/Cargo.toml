# SPDX-License-Identifier: GPL-3.0-or-later
# a stateless c abi over signal's libsignal-protocol: keys and records in,
# messages and new records out. the stores stay in the app's database
[package]
name = "kryfo_signal"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# only the canary test mtecheck.sh runs, never in a build
mtecheck = []

[dependencies]
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.4" }
# the versions libsignal-protocol already pulls in, so nothing new is built
async-trait = "0.1.92"
prost = "0.14.4"
rand = "0.9.4"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
