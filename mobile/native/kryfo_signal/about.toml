# cargo-about's config for the licences screen (acknowledgments.sh): the
# crates linked into the android library, without build scripts, proc
# macros or tests. the accepted list, in order of preference for a crate
# with a choice, and the clarifications are libsignal's own
# (acknowledgments/about.toml at v0.99.4), cut to the crates we link
targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
# no online lookups, and licence files only at a crate's top level
no-clearly-defined = true
max-depth = 1
workarounds = ["prost"]

accepted = [
    "CC0-1.0",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "AGPL-3.0-only",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

# curve25519-dalek carries code from go and from lizard. the hax and
# libcrux crates live in larger repositories
[curve25519-dalek.clarify]
license = "BSD-3-Clause AND MIT"

