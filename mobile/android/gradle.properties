# single declaration: a second org.gradle.jvmargs line silently replaces
# the first, which was killing the 8G heap settings.
# 4G heap, 1G metaspace. the build fits in that with room to spare, and the
# earlier 8G+4G let the daemon grow past what an 8G machine has: the kernel
# killed it three times in one afternoon at 6.5-7.2G resident, and the
# container build failed with "daemon disappeared". heap size does not
# touch the bytes that come out.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
android.useAndroidX=true

# everything needed is installed locally - never let gradle fetch SDK bits
android.builder.sdkDownload=false
