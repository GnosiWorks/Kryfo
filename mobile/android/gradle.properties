# single declaration: a second org.gradle.jvmargs line silently replaces
# the first, which was killing the 8G heap settings.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
android.useAndroidX=true

# everything needed is installed locally - never let gradle fetch SDK bits
android.builder.sdkDownload=false
