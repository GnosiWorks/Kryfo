# kryfo for linux as a flatpak, for a local or own-repo build. the flutter
# bundle (BUILDING.md desktop: build-linux.sh, build-host.sh,
# build-sqlcipher.sh, flutter build linux -t lib/main_desktop.dart,
# check-bundle.sh) is built before flatpak-builder runs and comes in as a
# local dir: flutter fetches packages while it builds and the sandbox has no
# network. sqlcipher and the voice recorder's ffmpeg build here from pinned
# sources. tor is go-libtor inside libhalo.so, built from engine/vendor and
# pinned there by go.sum, so there is no tor download of its own.
id: app.kryfo.Kryfo
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: kryfo
finish-args:
  # tor, bridges and relays
  - --share=network
  # wayland first, x11 only where there is no wayland
  - --socket=wayland
  - --socket=fallback-x11
  # x11 shared memory, used only under fallback-x11
  - --share=ipc
  # gpu rendering for flutter
  - --device=dri
  # voice notes: gstreamer plays them through pulse, parecord records them
  - --socket=pulseaudio
  # flutter_local_notifications_linux calls this bus name itself and has no
  # portal side yet. drop it once the app sends through
  # org.freedesktop.portal.Notification
  - --talk-name=org.freedesktop.Notifications
  # no other bus names and no --filesystem:
  # - files open and save through the file chooser portal (gtk's native
  #   chooser), dropped files come through the document portal, links open
  #   through the openuri portal
  # - the vault's key: libsecret uses the secret portal inside a flatpak and
  #   keeps it in the app's own keyring file, so no org.freedesktop.secrets
  # - start with the computer: the background portal writes the autostart
  #   entry itself (runner, ask_portal)
  # - the screen's lock, for notifications without words while it is up:
  #   the inhibit portal's monitor (runner, watch_screen_lock), not logind
  #   on the system bus
  # - the tray is gtk's status icon (xembed, x11 only), which needs no bus
  #   name. a statusnotifieritem tray would add
  #   --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: sqlcipher
    buildsystem: autotools
    # the same release, sha256 and options as mobile/linux/build-sqlcipher.sh
    config-opts:
      - --with-tempstore=yes
      - --fts5
      - --disable-tcl
      - --disable-static
      - --disable-readline
      # no /usr/local/lib run path in the library
      - --disable-rpath
      # libsqlcipher.so next to the runtime's libsqlite3, not in its place
      - --dll-basename=libsqlcipher
      - --soname=legacy
    make-args:
      - LDFLAGS.libsqlite3.soname=-Wl,-soname,libsqlcipher.so.0
    make-install-args:
      - LDFLAGS.libsqlite3.soname=-Wl,-soname,libsqlcipher.so.0
    build-options:
      cflags: -DSQLITE_HAS_CODEC -DSQLITE_EXTRA_INIT=sqlcipher_extra_init -DSQLITE_EXTRA_SHUTDOWN=sqlcipher_extra_shutdown
      # its own sqlite3_* calls stay inside it, not in the runtime's sqlite
      ldflags: -Wl,-Bsymbolic -lcrypto
    post-install:
      # the app opens /app/lib/libsqlcipher.so.0 by full path
      - cd ${FLATPAK_DEST}/lib && [ -e libsqlcipher.so.0 ] || ln -s "$(ls libsqlcipher.so.*.* | head -n1)" libsqlcipher.so.0
      - nm -D --defined-only ${FLATPAK_DEST}/lib/libsqlcipher.so.0 | grep -q ' T sqlite3_key$'
      # -Bsymbolic really reached the link, as check-bundle.sh asks of the tarball
      - readelf -d ${FLATPAK_DEST}/lib/libsqlcipher.so.0 | grep -qE '\(SYMBOLIC\)|\(FLAGS\).*SYMBOLIC'
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /share/man
    sources:
      - type: archive
        url: https://github.com/sqlcipher/sqlcipher/archive/refs/tags/v4.19.0.tar.gz
        # tag v4.19.0, commit c4b275a47932888216bade83aff2bbc73df0ff85
        sha256: 7075f96cbabe45b4ecfc2e6b1745a625f856f695b0827a5506ce9ed85b906aa0

  # record_linux pipes parecord's raw pcm into an ffmpeg binary, which the
  # runtime has no fixed promise of. this one does only that: raw s16le in,
  # wav out, nothing else
  - name: ffmpeg
    config-opts:
      - --disable-everything
      - --disable-autodetect
      - --disable-doc
      - --disable-network
      - --disable-ffplay
      - --disable-ffprobe
      - --disable-x86asm
      - --enable-protocol=pipe,file
      - --enable-demuxer=pcm_s16le
      - --enable-decoder=pcm_s16le
      - --enable-encoder=pcm_s16le
      - --enable-muxer=wav
      - --enable-filter=aformat,anull,aresample
    post-install:
      # what record_linux runs, so a missing piece stops the build
      - head -c 9600 /dev/zero | ${FLATPAK_DEST}/bin/ffmpeg -hide_banner -loglevel error -f s16le -ar 48000 -ac 1 -i - -c:a pcm_s16le -f wav t.wav
      - test "$(head -c 4 t.wav)" = RIFF
    cleanup:
      - /include
      - /lib
      - /share
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz
        sha256: 7138d28c96d9d3e3af4ee3d8cad72741f8ffb40da90c1112235dea3ecd3178a3

  - name: kryfo
    buildsystem: simple
    build-commands:
      - test -x bundle/kryfo
      - test -f bundle/lib/libhalo.so
      - test -f bundle/lib/libkryfo_signal.so
      # the sqlcipher module's copy is the one, built against the runtime's
      # openssl
      - rm -f bundle/lib/libsqlcipher.so.0
      # the bundle was built outside the sdk: it may not need a newer glibc
      # than the runtime has
      - >-
        have=$(getconf GNU_LIBC_VERSION | cut -d' ' -f2);
        need=$(find bundle -type f \( -name kryfo -o -name '*.so*' \) -exec objdump -T {} + 2>/dev/null | grep -o 'GLIBC_[0-9][0-9.]*' | cut -c7- | sort -uV | tail -n1);
        [ -z "$need" ] || [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | tail -n1)" = "$have" ] ||
        { echo "the bundle needs glibc $need, the runtime has $have" >&2; exit 1; }
      - mkdir -p ${FLATPAK_DEST}/lib/kryfo ${FLATPAK_DEST}/bin
      - cp -a bundle/. ${FLATPAK_DEST}/lib/kryfo/
      - ln -s ../lib/kryfo/kryfo ${FLATPAK_DEST}/bin/kryfo
      - install -Dm644 app.kryfo.Kryfo.desktop ${FLATPAK_DEST}/share/applications/app.kryfo.Kryfo.desktop
      - install -Dm644 app.kryfo.Kryfo.metainfo.xml ${FLATPAK_DEST}/share/metainfo/app.kryfo.Kryfo.metainfo.xml
      - mkdir -p ${FLATPAK_DEST}/share/icons
      - cp -r bundle/data/icons/hicolor ${FLATPAK_DEST}/share/icons/
    sources:
      # the checked bundle from BUILDING.md's desktop section
      - type: dir
        path: ../../mobile/build/linux/x64/release/bundle
        dest: bundle
      - type: file
        path: app.kryfo.Kryfo.desktop
      - type: file
        path: app.kryfo.Kryfo.metainfo.xml
