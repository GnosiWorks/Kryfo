# f-droid build metadata for kryfo.
#
# goes in the fdroiddata repo at metadata/app.kryfo.yml
#
# the engine (libhalo.so) must build byte-identically to what ships, so the
# toolchain is pinned exactly as in repro/Dockerfile: go 1.25.0 + ndk r28b,
# both checksum-verified. do not swap these for distro packages - a different
# go or ndk changes the output and the reproducible build check fails.

Categories:
  - Internet
  - Security
License: GPL-3.0-only
AuthorName: GnosiWorks
AuthorEmail: gnosiworks@proton.me
SourceCode: https://github.com/GnosiWorks/Kryfo
IssueTracker: https://github.com/GnosiWorks/Kryfo/issues
Changelog: https://github.com/GnosiWorks/Kryfo/blob/main/CHANGELOG.md

AutoName: Kryfo

RepoType: git
Repo: https://github.com/GnosiWorks/Kryfo.git

Builds:
  - versionName: 0.1.0-alpha
    versionCode: 1
    commit: v0.1.0-alpha
    subdir: mobile
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends ca-certificates curl unzip
      # go 1.25.0, checksum-verified
      - curl -fsSL https://go.dev/dl/go1.25.0.linux-amd64.tar.gz -o /tmp/go.tgz
      - echo "2852af0cb20a13139b3448992e69b868e50ed0f8a1e5940ee1de9e19a123b613  /tmp/go.tgz" | sha256sum -c -
      - rm -rf /usr/local/go
      - tar -C /usr/local -xzf /tmp/go.tgz
      - rm /tmp/go.tgz
      # android ndk r28b, checksum-verified
      - curl -fsSL https://dl.google.com/android/repository/android-ndk-r28b-linux.zip -o /tmp/ndk.zip
      - echo "e9f2759862cecfd48c20bbb7d8cfedbb020f4d91b5f78d9a2fc106f7db3c27ed  /tmp/ndk.zip" | sha256sum -c -
      - unzip -q /tmp/ndk.zip -d /opt
      - rm /tmp/ndk.zip
    srclibs:
      - flutter@3.41.7
    rm:
      - mobile/android/app/build
      - repro/ndk-extract
    prebuild:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    build: |
      set -e
      export PATH=/usr/local/go/bin:$PATH
      export ANDROID_NDK_HOME=/opt/android-ndk-r28b
      # deterministic engine build - flags mirror repro/build-repro.sh
      export CGO_ENABLED=1
      export GOFLAGS=-trimpath
      export SOURCE_DATE_EPOCH=1700000000
      export CGO_LDFLAGS="-Wl,--build-id=none"
      cd ../engine && bash build.sh
      cd ../mobile
      $$flutter$$/bin/flutter build apk --release \
        --target-platform android-arm64,android-x64
    output: build/app/outputs/flutter-apk/app-release.apk

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: 0.1.0-alpha
CurrentVersionCode: 1
